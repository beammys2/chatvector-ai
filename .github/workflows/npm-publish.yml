name: Publish TypeScript SDK

on:
  push:
    tags:
      - "sdk-typescript-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @chatvector/sdk
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#refs/tags/}"
          version="${tag#sdk-typescript-v}"
          if [ -z "$version" ] || [ "$version" = "$tag" ]; then
            echo "Tag must match sdk-typescript-v{semver}, got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json version ($pkg_version) does not match tag (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package
        run: npm run build

      - name: Test package exports
        run: npm run test:exports

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
